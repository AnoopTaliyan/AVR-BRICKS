<style>
/* Layout: soot-dark hero over a CSS running-bond brick wall, then a single column of plain bands: products as a price-list, a brick calculator, delivery, contact. Fixed WhatsApp bar on phones. */
:root{

  --brick:#A3341C; --brick-2:#8A2A15; --mortar:#C9B8AA; --soot:#1D1614; --on-soot:#F3E9E2;
  --wa:#1F8A4C; --on-accent:#FFF7F2;

  --body:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161110; --surface:#201917; --ink:#EFE5DE; --muted:#AE9D94; --line:#3A2E2A;
  --brick:#D4583A; --brick-2:#B8442A; --mortar:#4A3B35; --soot:#0E0A09; --on-soot:#F3E9E2;
  --wa:#2FA864; --on-accent:#1A0E0A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161110; --surface:#201917; --ink:#EFE5DE; --muted:#AE9D94; --line:#3A2E2A;
  --brick:#D4583A; --brick-2:#B8442A; --mortar:#4A3B35; --soot:#0E0A09; --on-soot:#F3E9E2;
  --wa:#2FA864; --on-accent:#1A0E0A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;padding-bottom:84px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:clamp(28px,5vw,40px)}
p{margin:0}
.label{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brick)}
a{color:inherit}
:focus-visible{outline:3px solid var(--brick);outline-offset:2px}

/* top bar */
.top{background:var(--soot);color:var(--on-soot)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.mark{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.04em;font-size:15px}
.mark i{width:22px;height:14px;background:var(--brick);border-radius:2px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.lang{display:flex;border:1px solid rgba(243,233,226,.35);border-radius:999px;overflow:hidden}
.lang button{all:unset;cursor:pointer;padding:6px 14px;font-size:14px;font-weight:700;color:var(--on-soot)}
.lang button[aria-pressed="true"]{background:var(--on-soot);color:var(--soot)}

/* hero: brick wall */
.hero{position:relative;color:var(--on-soot);background-color:#6E2414;
  background-image:
    linear-gradient(180deg,rgba(20,12,10,.55),rgba(20,12,10,.88)),
    linear-gradient(0deg,#3B1A12 3px,transparent 3px),
    linear-gradient(90deg,#3B1A12 3px,transparent 3px),
    linear-gradient(90deg,#3B1A12 3px,transparent 3px);
  background-size:100% 100%,100% 36px,96px 72px,96px 72px;
  background-position:0 0,0 0,0 0,48px 36px}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 80% 110%,rgba(255,120,40,.35),transparent 60%)}
.hero .wrap{position:relative;z-index:1;padding-block:56px 48px;display:grid;gap:18px}
.hero .label{color:#F2A27F}
.hero h1{font-size:clamp(44px,10vw,88px);color:#FFF1E8}
.hero .sub{font-family:var(--display);font-size:clamp(20px,3.4vw,28px);color:#F2C6B0}
.hero p.lead{max-width:56ch;font-size:18px;color:#EADBD2}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:17px;padding:13px 20px;border-radius:10px;border:0;cursor:pointer;font-family:var(--body)}
.btn-wa{background:var(--wa);color:#fff}
.btn-ghost{background:transparent;color:#FFF1E8;border:1.5px solid rgba(255,241,232,.5)}
.btn svg{width:20px;height:20px;flex:none}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:10px;font-size:15px;color:#E5CFC3}
.facts b{color:#fff}

/* sections */
section.band{padding-block:56px}
.head{display:grid;gap:8px;margin-bottom:28px;max-width:62ch}
.head p{color:var(--muted)}

/* products: price list */
.list{border-top:2px solid var(--ink)}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 20px;padding:20px 0;border-bottom:1px solid var(--line);align-items:center}
.row h3{font-size:24px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.row h3 small{font-family:var(--body);font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.row p{grid-column:1;color:var(--muted);max-width:60ch}
.row .use{grid-column:1;font-size:14px;color:var(--ink)}
.row .use b{color:var(--brick)}
.row .act{grid-column:2;grid-row:1/span 3;display:grid;gap:6px;justify-items:end;text-align:right}
.rate{font-size:14px;color:var(--muted)}
.mini{font-size:15px;padding:9px 14px;background:var(--brick);color:var(--on-accent)}
.spec{margin-top:18px;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.spec span{font-variant-numeric:tabular-nums}

/* calculator */
.calc-band{background:var(--surface);border-block:1px solid var(--line)}
.calc{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}
.fields{display:grid;gap:16px}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:15px}
.field input,.field select{font:inherit;font-size:18px;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.result{background:var(--soot);color:var(--on-soot);border-radius:12px;padding:24px;display:grid;gap:14px}
.big{font-family:var(--display);font-size:clamp(44px,8vw,64px);line-height:1;font-variant-numeric:tabular-nums;color:#FFD9C6}
.result .note{font-size:14px;color:#C9B6AB}
.result dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:15px}
.result dt{color:#C9B6AB}.result dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}

/* delivery + why */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.pt{display:grid;gap:8px;padding-top:16px;border-top:3px solid var(--brick)}
.pt h3{font-size:22px}
.pt p{color:var(--muted);font-size:16px}

/* contact */
.contact{background:var(--soot);color:var(--on-soot)}
.contact .wrap{padding-block:52px;display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center}
.contact h2{color:#FFF1E8}
.contact p{color:#D9C6BB}
.num{font-family:var(--display);font-size:clamp(34px,7vw,52px);color:#FFD9C6;letter-spacing:.02em;user-select:all;font-variant-numeric:tabular-nums}
.copy{all:unset;cursor:pointer;font-size:14px;font-weight:700;padding:6px 12px;border:1px solid rgba(243,233,226,.4);border-radius:999px}
.placeholder{display:inline-block;border:1px dashed rgba(243,233,226,.5);padding:2px 8px;border-radius:6px;font-size:15px}
footer{padding-block:20px;font-size:13px;color:var(--muted);text-align:center}

/* phone WhatsApp bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--wa);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar a{display:flex;justify-content:center;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;font-size:17px}
.bar svg{width:22px;height:22px}
@media (min-width:760px){.bar{display:none}body{padding-bottom:0}}

@media (max-width:760px){
  .calc,.contact .wrap{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr;gap:22px}
  .row{grid-template-columns:1fr}
  .row .act{grid-column:1;grid-row:auto;justify-items:start;text-align:left;grid-auto-flow:column;align-items:center;justify-content:space-between}
}
@media (prefers-reduced-motion:no-preference){.btn,.mini{transition:transform .15s}.btn:hover,.mini:hover{transform:translateY(-1px)}}

<script>
(function(){
  var PHONE = "917300774411";
  var lang = "hi";
  try { lang = localStorage.getItem("balaji-lang") || "hi"; } catch(e){}
  var names = {
    awwal:{hi:"अव्वल (पहला दर्जा)",en:"Awwal (First Class)"},
    doyam:{hi:"दोयम (दूसरा दर्जा)",en:"Doyam (Second Class)"},
    third:{hi:"तीसरा दर्जा",en:"Third Class"}
  };
  var BRICKS_PER_CFT = 13.5, WASTE = 1.05, PER_TROLLEY = 3000;
  var last = {bricks:0, trolleys:0};
  var fmt = function(n){ return Math.round(n).toLocaleString("en-IN"); };

  function msg(kind){
    var hi = lang === "hi";
    if (kind === "general") return hi ? "नमस्ते AVR ब्रिक्स, मुझे ईंटों का आज का भाव जानना है।" : "Hello AVR Bricks, I'd like today's brick rate.";
    if (kind === "calc") {
      var t = document.getElementById("type").value;
      return hi
        ? "नमस्ते, मुझे लगभग " + fmt(last.bricks) + " ईंट (" + names[t].hi + ") चाहिए। भाड़े समेत भाव बताइए। साइट का पता: "
        : "Hello, I need about " + fmt(last.bricks) + " bricks (" + names[t].en + "). Please share the price including freight. Site location: ";
    }
    return hi ? "नमस्ते, " + names[kind].hi + " ईंट का आज का भाव (प्रति 1000) क्या है?" : "Hello, what is today's rate for " + names[kind].en + " bricks (per 1,000)?";
  }
  function links(){
    document.querySelectorAll(".wa-link").forEach(function(a){
      a.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(msg(a.dataset.msg));
    });
  }
  function apply(l){
    lang = l;
    document.documentElement.lang = l;
    document.querySelectorAll("[data-" + l + "]").forEach(function(el){ el.textContent = el.getAttribute("data-" + l); });
    document.querySelectorAll(".lang button").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.lang === l ? "true" : "false"); });
    try { localStorage.setItem("balaji-lang", l); } catch(e){}
    calc();
  }
  function calc(){
    var L = parseFloat(document.getElementById("len").value) || 0;
    var H = parseFloat(document.getElementById("ht").value) || 0;
    var T = parseFloat(document.getElementById("thk").value) || 0;
    var vol = L * H * T;
    last.bricks = Math.ceil(vol * BRICKS_PER_CFT * WASTE);
    last.trolleys = last.bricks ? Math.ceil(last.bricks / PER_TROLLEY * 2) / 2 : 0;
    document.getElementById("out").textContent = fmt(last.bricks);
    document.getElementById("vol").textContent = vol.toFixed(1) + (lang === "hi" ? " घन फ़ुट" : " cu ft");
    document.getElementById("trl").textContent = last.trolleys;
    links();
  }
  document.querySelectorAll(".lang button").forEach(function(b){ b.addEventListener("click", function(){ apply(b.dataset.lang); }); });
  ["len","ht","thk","type"].forEach(function(id){ document.getElementById(id).addEventListener("input", calc); });
  document.getElementById("copy").addEventListener("click", function(){
    var btn = this, done = function(){ btn.textContent = lang === "hi" ? "कॉपी हो गया" : "Copied"; };
    try {
      navigator.clipboard.writeText("7300774411").then(done, function(){ sel(); });
    } catch(e){ sel(); }
    function sel(){ var r = document.createRange(); r.selectNodeContents(document.querySelector(".num")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  });
  apply(lang === "en" ? "en" : "hi");
})();
</script>
